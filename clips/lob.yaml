# Voice-over je Abschnitt des Standard-Ablaufs (oben, Fahrt, TV, Seite in Zeitlupe, hinter dir)
sprecher:
  - Hoch über das Netz.
  - Von hinten.
  - Spiel den Ball hoch über die Gegner am Netz, mit offener Schlagfläche.
  - Er landet tief, nahe der Rückwand. Die Gegner müssen das Netz verlassen.
  - Und ihr rückt vor und übernehmt das Netz.
