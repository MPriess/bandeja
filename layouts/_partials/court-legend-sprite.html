{{- /*
  Symbols for court legends, check marks and arrows, included once per page.
  Usage: partial "court-legend-sprite.html" . – then court-legend.html with "sprite" true.
*/ -}}
<svg aria-hidden="true" width="0" height="0" class="absolute">
  {{- range $r, $svg := partial "fn/legend-shapes.html" }}
  <symbol id="legende-{{ $r }}" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="var(--color-court-2)"/>{{ $svg | safeHTML }}</symbol>
  {{- end }}
  <symbol id="haken" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="pfeil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>
